################################################################################
# Node-RED Stack or Compose
################################################################################
# docker stack deploy node-red --compose-file docker-compose-node-red.yml
# docker-compose -f docker-compose-node-red.yml -p myNoderedProject up
################################################################################

services:
  node-red:
    build: .
    image: servorack-node-red-midi:local
    devices:
      - /dev/snd/seq:/dev/snd/seq
    group_add:
      - "${MIDI_AUDIO_GID:-29}" # Host audio group; ALSA sequencer access
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "1880:1880"
    networks:
      - node-red-net
    volumes:
      - node-red-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "192.168.88.100:1883:1883"
    networks:
      - node-red-net
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
  node-red-data:

networks:
  node-red-net: